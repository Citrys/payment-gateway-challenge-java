server.port=8090
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Bank simulator configuration
bank.simulator.url=http://localhost:8080
bank.simulator.timeout.connect=5000
bank.simulator.timeout.read=10000

# Retry configuration
payment.retry.max-attempts=3
payment.retry.initial-delay=1000
payment.retry.max-delay=10000
payment.retry.multiplier=2.0

# Supported currencies
payment.supported.currencies=USD,GBP,EUR